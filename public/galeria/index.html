<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galería · XV Yan</title>
<meta name="theme-color" content="#2a0611">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@500;600&display=swap">
<link rel="stylesheet" href="/estilo.css">
<style>
body{min-height:100dvh}
.envoltura{max-width:1200px;margin:0 auto;padding-block:max(28px,env(safe-area-inset-top)) 40px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header{text-align:center;display:grid;gap:4px;margin-bottom:28px}
h1{font-family:var(--script);font-weight:400;font-size:clamp(3rem,12vw,5rem);margin:0;line-height:1}
header p{margin:0;font-style:italic;font-size:1.15rem;color:var(--oro-claro)}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rejilla button{all:unset;cursor:pointer;display:block;aspect-ratio:4/5;border-radius:4px;overflow:hidden;background:var(--vino);
  box-shadow:0 0 0 2px var(--oro-oscuro);transition:transform .2s,box-shadow .2s}
.rejilla button:hover,.rejilla button:focus-visible{transform:translateY(-3px);box-shadow:0 0 0 2px var(--oro-claro),0 10px 24px rgba(0,0,0,.4)}
.rejilla img{width:100%;height:100%;object-fit:cover;display:block}
.vacia{text-align:center;font-style:italic;font-size:1.2rem;color:var(--oro-claro);padding:40px 0}
dialog{border:0;padding:0;background:transparent;max-width:min(96vw,900px);color:var(--marfil)}
dialog::backdrop{background:rgba(20,3,8,.92)}
.visor{display:grid;gap:14px;justify-items:center}
.visor img{max-width:100%;max-height:72vh;border:6px solid var(--oro);border-radius:3px}
.visor .quien{font-family:var(--script);font-size:2.6rem;color:var(--oro-claro);line-height:1}
.visor .msj{font-style:italic;font-size:1.2rem;text-align:center}
.visor .fila{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
a.btn{text-decoration:none}
nav{text-align:center;margin-top:28px}
nav a{color:var(--oro-claro);font-family:var(--sans);font-size:.8rem;letter-spacing:.1em}
</style>
</head>
<body class="fondo">
<div class="envoltura">
  <header>
    <span class="etiqueta">Mis XV años · Galería</span>
    <h1 class="oro-texto">Yan</h1>
    <p id="cuantas">Cargando fotos…</p>
  </header>
  <form id="entrar" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:420px;margin:0 auto 24px">
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password" style="flex:1;min-width:0;font:inherit;font-size:1.1rem;color:var(--marfil);background:rgba(0,0,0,.25);border:1px solid var(--oro-oscuro);border-radius:10px;padding:.6em .9em">
    <button class="btn" type="submit">Entrar</button>
  </form>
  <div class="rejilla" id="rejilla"></div>
</div>
<dialog id="visor"><div class="visor">
  <img id="vImg" alt="">
  <span class="quien" id="vQuien"></span><span class="msj" id="vMsj"></span>
  <div class="fila"><a class="btn" id="vBajar" href="#">Descargar</a><button class="btn fantasma" type="button" id="vCerrar">Cerrar</button></div>
</div></dialog>
<script>
const $ = (id) => document.getElementById(id);
let ultimo = "", fotos = [], pass = "", timer;
try { pass = sessionStorage.getItem("xv-admin") || ""; } catch {}
async function cargar(){
  try {
    const r = await fetch("/api/fotos?since=" + encodeURIComponent(ultimo), {cache:"no-store", headers:{"x-clave": pass}});
    if (r.status === 401) { $("cuantas").textContent = "Escribe la contraseña para ver las fotos."; $("entrar").hidden = false; clearInterval(timer); return; }
    $("entrar").hidden = true; try { sessionStorage.setItem("xv-admin", pass); } catch {}
    const {ids, items} = await r.json();
    const vivos = new Set(ids); fotos = fotos.filter((f) => vivos.has(f.id)).concat(items); if (ids.length) ultimo = ids[ids.length-1];
    pintar();
  } catch { $("cuantas").textContent = "No pudimos cargar las fotos. Recarga la página."; }
}
function pintar(){
  $("cuantas").textContent = fotos.length === 1 ? "1 foto compartida" : fotos.length + " fotos compartidas";
  const g = $("rejilla"); g.innerHTML = "";
  if (!fotos.length) { g.innerHTML = '<p class="vacia" style="grid-column:1/-1">Todavía no hay fotos.</p>'; return; }
  for (const f of fotos.slice().reverse()) {
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", f.name ? "Foto de " + f.name : "Foto");
    const im = new Image(); im.loading = "lazy"; im.src = "/api/foto/" + f.id; im.alt = ""; b.append(im);
    b.onclick = () => abrir(f); g.append(b);
  }
}
function abrir(f){
  $("vImg").src = "/api/foto/" + f.id; $("vImg").alt = f.name ? "Foto de " + f.name : "Foto";
  $("vQuien").textContent = f.name || ""; $("vMsj").textContent = f.msg ? "“" + f.msg + "”" : "";
  $("vBajar").href = "/api/foto/" + f.id + "?descargar"; $("visor").showModal();
}
$("vCerrar").onclick = () => $("visor").close();
$("visor").onclick = (e) => { if (e.target === $("visor")) $("visor").close(); };
$("entrar").onsubmit = (e) => { e.preventDefault(); pass = $("pass").value; cargar(); clearInterval(timer); timer = setInterval(cargar, 15000); };
if (pass) { cargar(); timer = setInterval(cargar, 15000); } else $("cuantas").textContent = "Escribe la contraseña para ver las fotos.";
</script>
</body>
</html>
