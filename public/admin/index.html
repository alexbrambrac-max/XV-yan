<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel · XV Yan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@500;600&display=swap">
<link rel="stylesheet" href="/estilo.css">
<style>
.envoltura{max-width:1100px;margin:0 auto;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
h1{font-weight:600;font-size:2rem;margin:0 0 4px}
p{margin:0 0 20px;font-size:1.1rem}
form{display:flex;gap:10px;flex-wrap:wrap;max-width:420px}
input{flex:1;min-width:0;font:inherit;font-size:1.1rem;color:var(--marfil);background:rgba(0,0,0,.25);border:1px solid var(--oro-oscuro);border-radius:10px;padding:.6em .9em}
.error{color:#ffb4b4;font-family:var(--sans);font-size:.85rem;min-height:1.2em;margin-top:8px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tar{background:rgba(0,0,0,.25);border:1px solid var(--oro-oscuro);border-radius:8px;overflow:hidden;display:grid}
.tar img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.tar div{padding:10px;display:grid;gap:8px;font-size:1rem}
.tar small{font-family:var(--sans);font-size:.72rem;color:var(--oro)}
.tar .btn{padding:.7em 1em;font-size:.72rem;background:#b8324f;color:var(--marfil)}
.tar .btn.seguro{background:#ff5d7a}
</style>
</head>
<body class="fondo">
<div class="envoltura">
  <span class="etiqueta">XV Yan · Panel</span>
  <h1>Moderar fotos</h1>
  <section id="entrar">
    <p>Escribe la contraseña del panel para poder quitar fotos de la pantalla y la galería.</p>
    <form id="forma"><input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="btn" type="submit">Entrar</button></form>
    <div class="error" id="error" role="alert"></div>
  </section>
  <section id="panel" hidden>
    <p id="cuantas"></p>
    <div class="rejilla" id="rejilla"></div>
  </section>
</div>
<script>
const $ = (id) => document.getElementById(id);
let pass = ""; try { pass = sessionStorage.getItem("xv-admin") || ""; } catch {}
const api = (body) => fetch("/api/borrar", {method:"POST", headers:{"content-type":"application/json","x-admin":pass}, body:JSON.stringify(body)});
async function entrar(){
  const r = await api({check:true});
  if (!r.ok) { $("error").textContent = "Contraseña incorrecta."; return; }
  try { sessionStorage.setItem("xv-admin", pass); } catch {}
  $("entrar").hidden = true; $("panel").hidden = false; cargar(); setInterval(cargar, 10000);
}
$("forma").onsubmit = (e) => { e.preventDefault(); pass = $("pass").value; entrar(); };
if (pass) entrar();
const vistos = new Map();
async function cargar(){
  const r = await fetch("/api/fotos", {cache:"no-store", headers:{"x-clave": pass}}); const {items} = await r.json();
  $("cuantas").textContent = items.length + " fotos. Toca «Quitar» dos veces para borrar una foto para siempre.";
  const g = $("rejilla"); const ids = new Set(items.map((i) => i.id));
  for (const [id, el] of vistos) if (!ids.has(id)) { el.remove(); vistos.delete(id); }
  for (const f of items.slice().reverse()) {
    if (vistos.has(f.id)) continue;
    const t = document.createElement("div"); t.className = "tar";
    t.innerHTML = `<img loading="lazy" alt=""><div><span></span><small></small><button class="btn" type="button">Quitar</button></div>`;
    t.querySelector("img").src = "/api/foto/" + f.id;
    t.querySelector("span").textContent = (f.name || "Sin nombre") + (f.msg ? " — " + f.msg : "");
    t.querySelector("small").textContent = new Date(f.ts).toLocaleTimeString("es-MX", {hour:"2-digit", minute:"2-digit"});
    const b = t.querySelector("button");
    b.onclick = async () => {
      if (!b.classList.contains("seguro")) { b.classList.add("seguro"); b.textContent = "¿Seguro? Toca otra vez"; setTimeout(() => { b.classList.remove("seguro"); b.textContent = "Quitar"; }, 4000); return; }
      b.disabled = true; b.textContent = "Quitando…";
      const r = await api({id: f.id});
      if (r.ok) { t.remove(); vistos.delete(f.id); } else { b.disabled = false; b.textContent = "No se pudo, reintenta"; }
    };
    vistos.set(f.id, t); g.prepend(t);
  }
}
</script>
</body>
</html>
