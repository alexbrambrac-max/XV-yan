<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel · XV Yan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@500;600&display=swap">
<link rel="stylesheet" href="../estilo.css">
<style>
.envoltura{max-width:1100px;margin:0 auto;padding-block:32px 60px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
h1{font-weight:600;font-size:2rem;margin:0 0 4px}
h2{font-weight:600;font-size:1.5rem;margin:36px 0 6px;display:flex;align-items:center;gap:12px}
h2 .num{font:600 .8rem var(--sans);background:var(--oro);color:var(--vino-hondo);border-radius:999px;padding:.25em .7em}
h2 .num.alerta{background:#ff5d7a;color:#fff}
p{margin:0 0 16px;font-size:1.1rem}
.barra{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 6px}
.barra .btn{padding:.8em 1.2em;font-size:.72rem;text-decoration:none}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tar{background:rgba(0,0,0,.25);border:1px solid var(--oro-oscuro);border-radius:8px;overflow:hidden;display:grid}
.pendiente .tar{border-color:#ff9db0;box-shadow:0 0 0 1px #ff9db0}
.tar img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#2a0611}
.tar .info{padding:10px;display:grid;gap:8px;font-size:1rem}
.tar small{font-family:var(--sans);font-size:.72rem;color:var(--oro)}
.tar .acc{display:flex;gap:8px}
.tar .btn{flex:1;padding:.75em .6em;font-size:.68rem;letter-spacing:.08em}
.tar .quitar{background:#b8324f;color:var(--marfil)}
.tar .quitar.seguro{background:#ff5d7a}
.vacio{font-style:italic;color:var(--oro-claro);grid-column:1/-1;margin:6px 0}
</style>
</head>
<body class="fondo">
<div class="envoltura">
  <span class="etiqueta">XV Yan · Panel</span>
  <h1>Moderar fotos</h1>
  <p>Las fotos dudosas no salen en la pantalla hasta que alguien las aprueba aquí. «Quitar» la borra para siempre (toca dos veces).</p>
  <div class="barra"><a class="btn fantasma" href="../dj/">Consola del DJ</a><a class="btn fantasma" href="../galeria/">Galería</a><button class="btn fantasma" type="button" id="salir">Salir</button></div>

  <h2>Por revisar <span class="num" id="nPend">0</span></h2>
  <div class="rejilla pendiente" id="pendientes"></div>

  <h2>En pantalla <span class="num" id="nOk">0</span></h2>
  <div class="rejilla" id="aprobadas"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const tarjetas = new Map(); // id → {el, estado}
const enRevision = (e) => e === "revisar" || e === "nueva";

function tarjeta(f, url){
  const t = document.createElement("div"); t.className = "tar";
  t.innerHTML = `<img loading="lazy" alt=""><div class="info"><span></span><small></small><div class="acc"></div></div>`;
  t.querySelector("img").src = url || "";
  t.querySelector("span").textContent = (f.nombre || "Sin nombre") + (f.mensaje ? " — " + f.mensaje : "");
  t.querySelector("small").textContent = new Date(f.created_at).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
  return t;
}
function acciones(t, f){
  const acc = t.querySelector(".acc"); acc.innerHTML = "";
  if (enRevision(f.estado)) {
    const ok = document.createElement("button"); ok.type = "button"; ok.className = "btn"; ok.textContent = "Aprobar";
    ok.onclick = async () => { ok.disabled = true; ok.textContent = "…"; try { await XV.marcar(f.id, "aprobada"); f.estado = "aprobada"; colocar(f); } catch (e) { console.error(e); ok.disabled = false; ok.textContent = "Reintentar"; } };
    acc.append(ok);
  }
  const q = document.createElement("button"); q.type = "button"; q.className = "btn quitar"; q.textContent = "Quitar";
  q.onclick = async () => {
    if (!q.classList.contains("seguro")) { q.classList.add("seguro"); q.textContent = "¿Seguro?"; setTimeout(() => { q.classList.remove("seguro"); q.textContent = "Quitar"; }, 4000); return; }
    q.disabled = true; q.textContent = "…";
    try { await XV.borrar(f); t.remove(); tarjetas.delete(f.id); contar(); } catch (e) { console.error(e); q.disabled = false; q.textContent = "Reintentar"; }
  };
  acc.append(q);
}
function colocar(f){
  const c = tarjetas.get(f.id); if (!c) return;
  c.estado = f.estado; acciones(c.el, f);
  (enRevision(f.estado) ? $("pendientes") : $("aprobadas")).prepend(c.el);
  contar();
}
function contar(){
  const p = [...tarjetas.values()].filter((c) => enRevision(c.estado)).length, a = [...tarjetas.values()].filter((c) => c.estado === "aprobada").length;
  $("nPend").textContent = p; $("nPend").classList.toggle("alerta", p > 0); $("nOk").textContent = a;
  for (const [id, txt] of [["pendientes", "Nada por revisar."], ["aprobadas", "Todavía no hay fotos en pantalla."]]) {
    const g = $(id); let v = g.querySelector(".vacio"); const hay = g.querySelector(".tar");
    if (!hay && !v) { v = document.createElement("p"); v.className = "vacio"; v.textContent = txt; g.append(v); }
    if (hay && v) v.remove();
  }
  document.title = (p ? `(${p}) ` : "") + "Panel · XV Yan";
}
async function cargar(){
  let fotos, urls;
  try { fotos = await XV.listar(); urls = await XV.urls(fotos.map((f) => f.path)); }
  catch (e) { console.error(e); return; }
  const ids = new Set(fotos.map((f) => f.id));
  for (const [id, c] of tarjetas) if (!ids.has(id)) { c.el.remove(); tarjetas.delete(id); }
  for (const f of fotos) {
    if (f.estado === "oculta") continue;
    const c = tarjetas.get(f.id);
    if (!c) { const el = tarjeta(f, urls[f.path]); tarjetas.set(f.id, { el, estado: null }); }
    if (!c || c.estado !== f.estado) colocar(f);
  }
  contar();
}
$("salir").onclick = () => XV.salir();
XV.sesion(() => { cargar(); setInterval(cargar, 5000); });
</script>
</body>
</html>
