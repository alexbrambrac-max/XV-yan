<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel · XV Yan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@500;600&display=swap">
<link rel="stylesheet" href="../estilo.css">
<style>
.envoltura{max-width:1100px;margin:0 auto;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
h1{font-weight:600;font-size:2rem;margin:0 0 4px}
p{margin:0 0 20px;font-size:1.1rem}
.barra{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.barra .btn{padding:.8em 1.2em;font-size:.72rem;text-decoration:none}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tar{background:rgba(0,0,0,.25);border:1px solid var(--oro-oscuro);border-radius:8px;overflow:hidden;display:grid}
.tar img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.tar div{padding:10px;display:grid;gap:8px;font-size:1rem}
.tar small{font-family:var(--sans);font-size:.72rem;color:var(--oro)}
.tar .btn{padding:.7em 1em;font-size:.72rem;background:#b8324f;color:var(--marfil)}
.tar .btn.seguro{background:#ff5d7a}
</style>
</head>
<body class="fondo">
<div class="envoltura">
  <span class="etiqueta">XV Yan · Panel</span>
  <h1>Moderar fotos</h1>
  <p id="cuantas">Cargando…</p>
  <div class="barra"><a class="btn fantasma" href="../galeria/">Galería</a><button class="btn fantasma" type="button" id="salir">Salir</button></div>
  <div class="rejilla" id="rejilla"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const vistos = new Map();
async function cargar(){
  let fotos, urls;
  try { fotos = await XV.listar(); urls = await XV.urls(fotos.map((f) => f.path)); }
  catch (e) { console.error(e); $("cuantas").textContent = "No pudimos cargar las fotos. Recarga la página."; return; }
  $("cuantas").textContent = fotos.length + " fotos. Toca «Quitar» dos veces para borrar una foto para siempre.";
  const g = $("rejilla"), ids = new Set(fotos.map((f) => f.id));
  for (const [id, el] of vistos) if (!ids.has(id)) { el.remove(); vistos.delete(id); }
  for (const f of fotos) {
    if (vistos.has(f.id)) continue;
    const t = document.createElement("div"); t.className = "tar";
    t.innerHTML = `<img loading="lazy" alt=""><div><span></span><small></small><button class="btn" type="button">Quitar</button></div>`;
    t.querySelector("img").src = urls[f.path] || "";
    t.querySelector("span").textContent = (f.nombre || "Sin nombre") + (f.mensaje ? " — " + f.mensaje : "");
    t.querySelector("small").textContent = new Date(f.created_at).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
    const b = t.querySelector("button");
    b.onclick = async () => {
      if (!b.classList.contains("seguro")) { b.classList.add("seguro"); b.textContent = "¿Seguro? Toca otra vez"; setTimeout(() => { b.classList.remove("seguro"); b.textContent = "Quitar"; }, 4000); return; }
      b.disabled = true; b.textContent = "Quitando…";
      try { await XV.borrar(f); t.remove(); vistos.delete(f.id); } catch (e) { console.error(e); b.disabled = false; b.textContent = "No se pudo, reintenta"; }
    };
    vistos.set(f.id, t); g.prepend(t);
  }
}
$("salir").onclick = () => XV.salir();
XV.sesion(() => { cargar(); setInterval(cargar, 10000); });
</script>
</body>
</html>
