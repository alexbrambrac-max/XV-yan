<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis XV · Yan Legorreta</title>
<meta name="theme-color" content="#3d0a1a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@500;600&display=swap">
<style>
/* Diseño de Claude Design (Cel1/Cel2/Cel3): vino + dorado. */
:root{--oro:#d8b25a;--oro-claro:#f6e3a8;--oro-texto:#e9c977;--oro-oscuro:#b98a35;--marfil:#fbf3e4;--tinta:#2a0611;--suave:#e3c9a0;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:#22050f}
body{font-family:"Cormorant Garamond",Georgia,serif;color:var(--marfil);-webkit-font-smoothing:antialiased}
.mont{font-family:Montserrat,system-ui,sans-serif;font-weight:600}
.script{font-family:"Pinyon Script",cursive;font-weight:400}
.paso{min-height:100dvh;max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;
  padding:max(40px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
  background:radial-gradient(ellipse 90% 60% at 50% 20%,#6a1830 0%,#3d0a1a 60%,#22050f 100%)}
.paso.entra{animation:entra .5s cubic-bezier(.2,.8,.2,1)}
@keyframes entra{from{opacity:0;transform:translateY(16px)}}
.ceja{font-size:11px;letter-spacing:.5em;padding-left:.5em;color:var(--oro)}
.orn{display:flex;align-items:center;gap:8px}
.orn i{display:block;width:54px;height:1px;background:var(--oro)}
.orn b{display:block;width:6px;height:6px;background:var(--oro);transform:rotate(45deg)}
.borde-oro{padding:4px;border-radius:16px;background:linear-gradient(145deg,#fff1c4,#c99a45 30%,#f6e3a8 55%,#9c7a2e 85%)}
.esq{position:absolute;width:22px;height:22px;border:0 solid var(--oro)}
.esq.a{left:10px;top:10px;border-left-width:1.5px;border-top-width:1.5px}
.esq.b{right:10px;top:10px;border-right-width:1.5px;border-top-width:1.5px}
.esq.c{left:10px;bottom:10px;border-left-width:1.5px;border-bottom-width:1.5px}
.esq.d{right:10px;bottom:10px;border-right-width:1.5px;border-bottom-width:1.5px}
.btn{width:100%;border:none;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;font-family:Montserrat,system-ui,sans-serif;font-weight:600;transition:transform .12s,filter .2s}
.btn:active{transform:scale(.97)}
label.btn,label.otra{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.oculto{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);left:0;top:0}
.btn.oro{height:58px;font-size:15px;letter-spacing:.2em;color:var(--tinta);background:linear-gradient(180deg,#fff1c4,#d8b25a 55%,#b98a35);box-shadow:0 10px 24px rgba(8,0,3,.5);position:relative;overflow:hidden}
.btn.linea{height:52px;font-size:13px;letter-spacing:.2em;color:var(--oro-claro);background:transparent;border:1.5px solid var(--oro-oscuro)}
.btn:disabled{cursor:wait}
.btn .llenado{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(42,6,17,.18);transition:width .2s}
.btn span{position:relative}
:focus-visible{outline:2px solid var(--oro-claro);outline-offset:3px}
.nota{margin-top:16px;font-family:Montserrat,system-ui,sans-serif;font-weight:500;font-size:11px;letter-spacing:.12em;color:var(--suave)}
.error{color:#ffc2c2;font-family:Montserrat,system-ui,sans-serif;font-weight:500;font-size:13px;line-height:1.4;text-align:center;min-height:18px;margin:10px 0 0}
.crece{flex-grow:1;min-height:20px}

/* paso 1 */
#p1 .yan{font-size:76px;line-height:1.1;color:var(--oro-texto);margin-bottom:-6px}
#p1 .apellido{font-size:18px;letter-spacing:.42em;padding-left:.42em}
#p1 .orn{margin:14px 0 22px}
#p1 .lema{font-style:italic;font-size:26px;line-height:1.15;text-align:center;max-width:300px}
#p1 .borde-oro{margin-top:22px}
#p1 .cuadro{position:relative;width:268px;height:300px;max-width:calc(100vw - 56px);border-radius:12px;background:var(--tinta);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#p1 .aro{width:84px;height:84px;border-radius:50%;border:1.5px solid rgba(233,201,119,.6);display:flex;align-items:center;justify-content:center;animation:pulso 2.6s ease-in-out infinite}
@keyframes pulso{50%{box-shadow:0 0 0 10px rgba(233,201,119,.08)}}
#p1 .cuadro p{margin:0;font-style:italic;font-size:19px;text-align:center;color:var(--oro-claro);max-width:200px;line-height:1.2}
.acciones{width:100%;display:flex;flex-direction:column;gap:12px}

/* paso 2 */
#p2{padding-top:max(28px,env(safe-area-inset-top))}
#p2 .arriba{width:100%;display:flex;align-items:center;justify-content:space-between}
#p2 .arriba .script{font-size:40px;line-height:1;color:var(--oro-texto)}
#p2 .arriba .mont{font-weight:500;font-size:11px;letter-spacing:.12em;color:var(--suave)}
#p2 .borde-oro{margin-top:16px;box-shadow:0 18px 40px rgba(8,0,3,.55)}
#p2 .vista{position:relative;width:236px;height:290px;border-radius:12px;overflow:hidden;background:#5c1d30}
/* revisando la foto */
.revisando{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(42,6,17,.66);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);color:var(--oro-claro);transition:opacity .4s}
.revisando.fuera{opacity:0;pointer-events:none}
.revisando .aro-giro{width:52px;height:52px;border-radius:50%;border:3px solid rgba(246,227,168,.22);border-top-color:#f6e3a8;border-right-color:#d8b25a;animation:gira .9s linear infinite}
.revisando p{margin:0;font-style:italic;font-size:21px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.revisando small{font-family:Montserrat,system-ui,sans-serif;font-weight:500;font-size:10px;letter-spacing:.18em;color:var(--suave)}
.revisando::after{content:"";position:absolute;left:0;right:0;height:3px;top:0;background:linear-gradient(90deg,transparent,#f6e3a8,transparent);box-shadow:0 0 14px rgba(246,227,168,.8);animation:escanea 1.6s ease-in-out infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes escanea{0%{top:0}50%{top:calc(100% - 3px)}100%{top:0}}
.mini-giro{display:none;width:16px;height:16px;border-radius:50%;border:2px solid rgba(42,6,17,.25);border-top-color:#2a0611;animation:gira .8s linear infinite;position:relative}
#enviar.cargando .mini-giro{display:inline-block}
#enviar.cargando svg{display:none}
#p2 .vista img{width:100%;height:100%;object-fit:cover;display:block}
.otra{margin-top:10px;min-height:44px;padding:0 16px;border:none;background:transparent;color:var(--oro-claro);font-size:12px;letter-spacing:.16em;display:flex;align-items:center;gap:8px;cursor:pointer}
.campos{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:6px}
.campos label{display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:.2em;color:var(--oro-texto)}
.campos label small{font-weight:500;letter-spacing:.1em;color:var(--suave);font-size:11px}
.campos input{height:50px;padding:0 16px;border-radius:12px;border:1.5px solid rgba(216,178,90,.55);background:rgba(251,243,228,.08);color:var(--marfil);font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;letter-spacing:0}
.campos input::placeholder{color:#b89a86}
.campos input:focus{border-color:var(--oro-claro);outline:none;background:rgba(251,243,228,.12)}

/* paso 3 */
#p3{padding-top:max(40px,env(safe-area-inset-top));background:radial-gradient(ellipse 90% 60% at 50% 35%,#6a1830 0%,#3d0a1a 60%,#22050f 100%)}
#p3 .yan{font-size:56px;line-height:1.1;color:var(--oro-texto)}
.polaroid{position:relative;margin-top:30px;transform:rotate(-3deg);padding:10px 10px 0;background:var(--marfil);border-radius:4px;box-shadow:0 24px 50px rgba(5,0,2,.6)}
.polaroid.cae{animation:cae .9s cubic-bezier(.2,.9,.3,1.15)}
@keyframes cae{from{opacity:0;transform:translateY(-60px) rotate(8deg) scale(.9)}}
.polaroid .foto{width:200px;height:236px;overflow:hidden;background:#5c1d30}
.polaroid .foto img{width:100%;height:100%;object-fit:cover;display:block}
.polaroid .nom{height:48px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#4a0f1f;max-width:200px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.palomita{position:absolute;right:-18px;top:-18px;width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,#fff1c4,#d8b25a 55%,#b98a35);border:2px solid var(--marfil);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(8,0,3,.5)}
.polaroid.cae .palomita{animation:sello .5s .7s cubic-bezier(.2,.9,.3,1.4) backwards}
@keyframes sello{from{transform:scale(0)}}
#p3 h1{margin:34px 0 0;font-style:italic;font-weight:400;font-size:38px;line-height:1.05;text-align:center}
#p3 .gracias{margin-top:12px;font-size:20px;line-height:1.3;text-align:center;color:var(--oro-claro);max-width:290px}
.destello{position:absolute;border-radius:50%;background:var(--oro-claro);animation:titila 2.4s ease-in-out infinite alternate}
@keyframes titila{to{opacity:.15;transform:scale(.6)}}
canvas#chispas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<input id="camara" class="oculto" type="file" accept="image/*" capture="user" tabindex="-1" aria-hidden="true">
<input id="galeria" class="oculto" type="file" accept="image/*" tabindex="-1" aria-hidden="true">

<!-- Paso 1: tomar o elegir foto -->
<main class="paso" id="p1">
  <div class="mont ceja">MIS XV AÑOS</div>
  <div class="script yan">Yan</div>
  <div class="apellido">LEGORRETA</div>
  <div class="orn" aria-hidden="true"><i></i><b></b><i></i></div>
  <div class="lema">Comparte tu selfie y aparece en la pantalla</div>
  <div class="borde-oro">
    <div class="cuadro">
      <div class="aro"><svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#e9c977" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
      <p>Tómate una foto con tu mejor sonrisa</p>
      <div class="esq a"></div><div class="esq b"></div><div class="esq c"></div><div class="esq d"></div>
    </div>
  </div>
  <p class="error" id="error1" role="alert"></p>
  <div class="crece"></div>
  <div class="acciones">
    <label for="camara" role="button" tabindex="0" class="btn oro" id="tomar"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2a0611" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>TOMAR SELFIE</span></label>
    <label for="galeria" role="button" tabindex="0" class="btn linea" id="elegir"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f6e3a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>ELEGIR DE MI GALERÍA</label>
  </div>
  <div class="nota">Paso 1 de 2 · Sin descargar apps</div>
</main>

<!-- Paso 2: vista previa y envío -->
<form class="paso" id="p2" hidden novalidate>
  <div class="arriba"><div class="script">Yan</div><div class="mont">Paso 2 de 2</div></div>
  <div class="borde-oro"><div class="vista" id="vista"></div></div>
  <label for="camara" role="button" tabindex="0" class="otra mont" id="otra"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f6e3a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>TOMAR OTRA</label>
  <div class="campos">
    <label class="mont" for="nombre">TU NOMBRE
      <input id="nombre" type="text" maxlength="40" placeholder="Ej. Tía Mary" autocomplete="given-name">
    </label>
    <label class="mont" for="mensaje"><span>UN MENSAJE PARA YAN <small>(opcional)</small></span>
      <input id="mensaje" type="text" maxlength="90" placeholder="¡Felicidades, hermosa!">
    </label>
  </div>
  <p class="error" id="error2" role="alert"></p>
  <div class="crece"></div>
  <button class="btn oro" type="submit" id="enviar"><i class="llenado" id="llenado"></i><i class="mini-giro" aria-hidden="true"></i><span id="enviarTxt">ENVIAR A LA PANTALLA</span><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2a0611" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:relative"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</form>

<!-- Paso 3: ¡enviada! -->
<main class="paso" id="p3" hidden>
  <div class="destello" aria-hidden="true" style="left:50px;top:150px;width:8px;height:8px;filter:blur(1px)"></div>
  <div class="destello" aria-hidden="true" style="right:70px;top:110px;width:6px;height:6px;animation-delay:.8s"></div>
  <div class="destello" aria-hidden="true" style="right:60px;top:420px;width:10px;height:10px;filter:blur(2px);animation-delay:.4s"></div>
  <div class="destello" aria-hidden="true" style="left:34px;top:470px;width:6px;height:6px;animation-delay:1.2s"></div>
  <div class="mont ceja">MIS XV AÑOS</div>
  <div class="script yan">Yan</div>
  <div class="polaroid" id="polaroid">
    <div class="foto" id="fotoFinal"></div>
    <div class="nom script" id="nomFinal">Con cariño</div>
    <div class="palomita"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2a0611" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  </div>
  <h1>¡Gracias por compartir!</h1>
  <div class="gracias">Tu foto ya va en camino. Voltea a la pantalla, aparecerá en unos segundos.</div>
  <div class="crece"></div>
  <div class="acciones">
    <button class="btn oro" type="button" id="mas"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2a0611" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>SUBIR OTRA FOTO</span></button>
  </div>
</main>
<canvas id="chispas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script type="module">
  import { precargar, revisar } from "./filtro.js";
  window.XVFiltro = { precargar, revisar };
  const arranca = () => precargar().catch(() => {});
  "requestIdleCallback" in window ? requestIdleCallback(arranca, { timeout: 1500 }) : setTimeout(arranca, 800);
  window.dispatchEvent(new Event("xv-filtro"));
</script>
<script>
const $ = (id) => document.getElementById(id);
let foto = null, fotoURL = "";
try { $("nombre").value = localStorage.getItem("xv-nombre") || ""; } catch {}

function ir(n){
  for (const k of [1, 2, 3]) $("p" + k).hidden = k !== n;
  const el = $("p" + n); el.classList.remove("entra"); void el.offsetWidth; el.classList.add("entra");
  scrollTo(0, 0);
}
// Los botones son <label for="…">: abren la cámara o la galería de forma nativa.
for (const id of ["tomar", "elegir", "otra"]) $(id).addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $(id).click(); } });
$("mas").onclick = () => { foto = null; $("error1").textContent = ""; ir(1); };

// Reduce la foto en el celular para que suba rápido aunque la señal sea mala.
async function comprimir(file){
  const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = URL.createObjectURL(file); });
  const lado = 1600, k = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  lienzo = c;
  return await new Promise((ok) => c.toBlob(ok, "image/jpeg", .86));
}

/* Revisión: que haya una cara y que no sea contenido para adultos */
let lienzo = null, revision = "pendiente", turno = 0;
const filtroListo = () => window.XVFiltro ? Promise.resolve(window.XVFiltro) : new Promise((ok) => addEventListener("xv-filtro", () => ok(window.XVFiltro), { once: true }));
function estadoEnviar(texto, activo, cargando = false){ $("enviarTxt").textContent = texto; $("enviar").disabled = !activo; $("enviar").classList.toggle("cargando", cargando); $("enviar").style.filter = activo || cargando ? "" : "grayscale(.5) brightness(.8)"; }
function cargando(si){
  let c = $("vista").querySelector(".revisando");
  if (si) { if (!c) { c = document.createElement("div"); c.className = "revisando"; c.setAttribute("role", "status");
      c.innerHTML = '<div class="aro-giro"></div><p>Revisando tu foto…</p><small>SOLO TOMA UNOS SEGUNDOS</small>'; $("vista").append(c); }
    c.classList.remove("fuera"); }
  else if (c) { c.classList.add("fuera"); setTimeout(() => c.remove(), 450); }
}
async function revisarFoto(){
  const mio = ++turno; revision = "pendiente"; $("error2").textContent = "";
  estadoEnviar("REVISANDO FOTO…", false, true); cargando(true);
  try {
    const r = await (await filtroListo()).revisar(lienzo);
    if (mio !== turno) return;
    cargando(false);
    if (r.adulto) { revision = "bloqueada"; foto = null; estadoEnviar("ENVIAR A LA PANTALLA", false); $("error2").textContent = "Esta foto no se puede enviar. Por favor toma otra."; return; }
    if (!r.cara) { revision = "bloqueada"; foto = null; estadoEnviar("ENVIAR A LA PANTALLA", false); $("error2").textContent = "No encontramos ninguna cara. Asegúrate de que se vean tu nariz y tu boca (los lentes y sombreros sí se valen)."; return; }
    revision = "ok"; estadoEnviar("ENVIAR A LA PANTALLA", true);
  } catch (e) {
    if (mio !== turno) return; console.error(e); cargando(false);
    revision = "error"; estadoEnviar("REINTENTAR REVISIÓN", true);
    $("error2").textContent = "No pudimos revisar tu foto. Revisa tu señal y vuelve a intentar.";
  }
}

async function alElegir(e) {
  const entrada = e.target, f = entrada.files[0]; entrada.value = ""; if (!f) return;
  const err = $("p1").hidden ? $("error2") : $("error1"); err.textContent = "";
  try { foto = await comprimir(f); } catch { err.textContent = "No pudimos abrir esa foto. Intenta con otra."; return; }
  if (fotoURL) URL.revokeObjectURL(fotoURL); fotoURL = URL.createObjectURL(foto);
  $("vista").innerHTML = ""; const im = new Image(); im.src = fotoURL; im.alt = "Tu selfie"; $("vista").append(im);
  $("error2").textContent = "";
  if ($("p2").hidden) ir(2);
  else im.animate([{opacity:0, transform:"scale(1.06)"}, {opacity:1, transform:"scale(1)"}], {duration:500, easing:"ease-out"});
  revisarFoto();
}
$("camara").addEventListener("change", alElegir);
$("galeria").addEventListener("change", alElegir);

$("p2").onsubmit = (e) => {
  e.preventDefault();
  if (revision === "error") { revisarFoto(); return; }
  if (!foto || revision !== "ok") return;
  const nombre = $("nombre").value.trim(), mensaje = $("mensaje").value.trim();
  try { localStorage.setItem("xv-nombre", nombre); } catch {}
  $("enviar").disabled = true; $("enviar").classList.add("cargando"); $("enviarTxt").textContent = "ENVIANDO…"; $("error2").textContent = "";
  const fin = () => { $("enviar").classList.remove("cargando"); $("enviar").disabled = false; $("enviarTxt").textContent = "ENVIAR A LA PANTALLA"; $("llenado").style.transition = ""; $("llenado").style.width = "0"; };
  if (!XV.listo) { fin(); $("error2").textContent = "La página aún no está configurada. Avisa a los organizadores."; return; }
  // barra de avance estimada (Supabase no reporta el progreso de subida)
  $("llenado").style.transition = "width 6s cubic-bezier(.1,.7,.3,1)"; requestAnimationFrame(() => $("llenado").style.width = "88%");
  (async () => {
    let ok = false, msg = "No se pudo enviar. Revisa tu señal e inténtalo otra vez.";
    try {
      const path = crypto.randomUUID() + ".jpg";
      const up = await XV.db.storage.from("fotos").upload(path, foto, { contentType: "image/jpeg", upsert: false });
      if (up.error) throw up.error;
      const ins = await XV.db.from("fotos").insert({ path, nombre: nombre.slice(0, 40) || null, mensaje: mensaje.slice(0, 90) || null });
      if (ins.error) throw ins.error;
      ok = true;
    } catch (e) { if (!navigator.onLine) msg = "Sin conexión. Revisa tu señal e inténtalo otra vez."; console.error(e); }
    fin();
    if (ok) {
      $("mensaje").value = "";
      $("fotoFinal").innerHTML = ""; const im = new Image(); im.src = fotoURL; im.alt = "Tu foto enviada"; $("fotoFinal").append(im);
      $("nomFinal").textContent = nombre || "Con cariño";
      ir(3); const p = $("polaroid"); p.classList.remove("cae"); void p.offsetWidth; p.classList.add("cae");
      setTimeout(chispas, 350);
    } else $("error2").textContent = msg;
  })();
};

function chispas(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("chispas"), g = c.getContext("2d"), dpr = devicePixelRatio || 1; c.width = innerWidth*dpr; c.height = innerHeight*dpr; g.scale(dpr, dpr);
  const cols = ["#f6e3a8", "#d8b25a", "#fbf3e4", "#b98a35", "#fff1c4"];
  const ps = Array.from({length: 110}, () => { const an = Math.random()*6.283, s = Math.random()*10 + 3;
    return {x: innerWidth/2, y: innerHeight*.3, vx: Math.cos(an)*s, vy: Math.sin(an)*s - 4, r: Math.random()*4 + 2, c: cols[Math.random()*5|0], a: Math.random()*6, l: 1, star: Math.random() < .35}; });
  (function paso(){ g.clearRect(0, 0, innerWidth, innerHeight); let vivos = 0;
    for (const p of ps){ if (p.l <= 0) continue; vivos++; p.vy += .22; p.vx *= .98; p.x += p.vx; p.y += p.vy; p.a += .2; p.l -= .008;
      g.save(); g.globalAlpha = Math.max(p.l, 0); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c;
      if (p.star){ g.beginPath(); for (let i = 0; i < 4; i++){ g.rotate(1.5708); g.moveTo(0, 0); g.quadraticCurveTo(p.r*.3, p.r*.3, 0, p.r*1.8); } g.fill(); }
      else g.fillRect(-p.r, -p.r/2, p.r*2, p.r);
      g.restore(); }
    if (vivos) requestAnimationFrame(paso); else g.clearRect(0, 0, innerWidth, innerHeight); })();
}
